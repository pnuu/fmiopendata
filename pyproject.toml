[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "fmiopendata"
description = "Python library for accessing FMI open data"
readme = "README.md"
authors = [{name = "Panu Lahtinen", email = "pnuu+git@iki.fi"}]
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Topic :: Scientific/Engineering",
]
dependencies = ["numpy", "requests", "defusedxml"]
dynamic = ["version"]

[project.optional-dependencies]
radar = ["rasterio"]
grid = ["eccodes"]
netcdf = ["netCDF4"]
pandas = ["pandas"]
all = ["rasterio", "eccodes", "netCDF4", "pandas"]

[project.urls]
Homepage = "https://github.com/pnuu/fmiopendata"

# The names keep the ".py" the scripts have always been installed under
[project.scripts]
"wfs_html.py" = "fmiopendata.wfs_html:main"
"wms_html.py" = "fmiopendata.wms_html:main"

# The version is the git tag, plus the distance from it when the checkout is not
# exactly on one: a release is made by tagging it and nothing else
[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["fmiopendata"]
exclude = ["fmiopendata/tests"]

# Everything else in the checkout - the generated catalogues, the CI configuration,
# the notes - is of no use to anyone installing the package.  The tests are, so
# they are in the source distribution although they are not in the wheel
[tool.hatch.build.targets.sdist]
include = [
    "/fmiopendata",
    "/README.md",
    "/setup.cfg",
]

[tool.pytest.ini_options]
markers = ["network: the test downloads data from the FMI open data services"]
